# 【临时文件】单点验证 release job —— 验证完就删。
#
# 为什么需要它：三平台的构建 / 测试 / 打包已经全绿（run 35747907386），
# 只有最后的「创建 Release」红着，而那句 `exit code 1` 背后的原因可能是
# 「gh 没有 git 上下文」也可能是「token 权限不够」—— 两者都只值一次几十秒的
# 尝试，却要花掉正式流程里 23 分钟的重新编译才能问到。
# 这里把那一轮已经躺在 GitHub 上的 artifact 取回来，只跑发布逻辑。
name: Debug Release

on:
  workflow_dispatch:
  # 本机没有 GitHub token，没法调 workflow_dispatch 那个需要认证的 API，
  # 所以让推送这个文件本身成为触发器。
  push:
    paths:
      - ".github/workflows/debug-release.yml"

permissions:
  # 显式声明 permissions 之后，没列出来的作用域会变成 none ——
  # `gh run download` 读的是 Actions 的 artifact，所以要单独开 actions: read。
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 第一步就把它放进来：正式流程里 release job 原本没有 checkout，
      # 这是「gh 找不到仓库」的头号嫌疑。
      - uses: actions/checkout@v5

      - name: 取回构建产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ===== 取回 =====
            mkdir -p dist
            gh run download 35747907386 --dir dist-raw
            echo ===== 原始布局 =====
            find dist-raw -type f
            find dist-raw -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
            echo ===== 拍平之后 =====
            ls -la dist
          } 2>&1 | tee ci-output.txt

      - name: 写 Release 说明
        env:
          TAG: v0.1.0
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## 下载

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows 10 / 11 | `ngy-image-viewer-__TAG__-x86_64-windows.zip` | 解压即用。已静态链接 CRT，不需要装 VC++ 运行库 |
          | macOS（Apple Silicon） | `ngy-image-viewer-__TAG__-arm64-macos.zip` | 解压后把 `ngy-image-viewer.app` 拖进「应用程序」 |
          | macOS（Intel） | `ngy-image-viewer-__TAG__-x86_64-macos.zip` | 同上，按机器架构各取所需 |
          | Linux x86_64 | `ngy-image-viewer-__TAG__-x86_64-linux.tar.gz` | 解压后把二进制放进 `PATH`，再把包里的 `.desktop` 装到 `~/.local/share/applications/` |

          ### 首次打开可能被系统拦下

          - **macOS**：这些包**没有签名、也没有公证**（那需要付费的 Apple Developer 账号）。
            首次打开请**右键 →「打开」**，或执行
            `xattr -dr com.apple.quarantine /Applications/ngy-image-viewer.app`。
            直接双击会被 Gatekeeper 提示「无法验证开发者」。
          - **Windows**：SmartScreen 可能提示「Windows 已保护你的电脑」，
            点「更多信息 → 仍要运行」。exe 的属性 →「详细信息」里有版本信息可核对。

          ### 系统要求

          - macOS **15 或更高**（gpui-kit 0.6 的要求）
          - Linux 需要图形环境（X11 或 Wayland）与 Vulkan / OpenGL 驱动
          - HEIC / AVIF：Windows 走系统 WIC（缺「HEIF 图像扩展」时会给出安装指引）；
            macOS / Linux **尚未接入**，会返回一条明确的提示而不是静默失败

          ### 已知限制

          macOS 与 Linux 的构建与运行来自 CI 的首次实测 —— 在此之前本项目从未在这两个
          系统上编过。遇到问题请带上系统版本与复现步骤提 issue。

          完整说明、支持的格式清单，以及手工把格式关联到本程序的步骤，见仓库 README。
          NOTES
          sed -i "s/__TAG__/${TAG}/g" notes.md
          head -5 notes.md

      - name: 诊断并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.1.0
          {
            echo "===== 现在是什么状态 ====="
            gh release view "${TAG}" --json isDraft,isPrerelease,tagName,url,createdAt,publishedAt 2>&1 \
              || echo "(view 返回非零)"
            echo "===== 列表（含 draft）====="
            gh release list --limit 10 2>&1 || true
            echo "===== dist/ ====="
            ls -la dist
            echo
            echo "===== 发布 ====="
            if gh release view "${TAG}" >/dev/null 2>&1; then
              # 删 tag 再重推会把 Release 打回 draft —— GitHub 在 tag 消失的那个窗口里
              # 就这么做了。而 draft 在匿名 API 与 Releases 页面上都看不见：
              # 每一步都成功、外面却什么都没有。--draft=false 是这行存在的全部理由。
              gh release edit "${TAG}" --draft=false --title "${TAG}" --notes-file notes.md
              gh release upload "${TAG}" dist/* --clobber
            else
              gh release create "${TAG}" \
                --title "${TAG}" \
                --notes-file notes.md \
                dist/*
            fi
          } 2>&1 | tee -a ci-output.txt

      - name: 失败时把输出推到一个分支
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          {
            set -x
            mkdir -p ci-log
            cp ci-output.txt ci-log/debug-release.txt
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-log/debug-release
            git add -f ci-log/debug-release.txt
            git commit -m "ci: debug release 的输出"
            git push --force origin ci-log/debug-release
          } > push-report.txt 2>&1 || echo "推送失败（原因在 push-report.txt 里）"

      - name: 把输出打成注解
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib

          def excerpt(path, head, tail):
              p = pathlib.Path(path)
              if not p.exists():
                  return f"（没有 {path}）"
              text = p.read_text(encoding="utf-8", errors="replace")
              if len(text) <= head + tail:
                  return text
              return text[:head] + "\n......（中略）......\n" + text[-tail:]

          body = excerpt("ci-output.txt", 1500, 4000)
          body += "\n\n===== 推送 ci-log 分支的尝试 =====\n"
          body += excerpt("push-report.txt", 200, 1200)
          escaped = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=debug release 的输出::{escaped}")
          PY
